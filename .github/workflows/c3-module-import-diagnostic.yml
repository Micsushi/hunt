name: C3 explicit module diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Compare explicit built-in module imports
        working-directory: executioner
        run: node scripts/diagnose-module-import.ts
