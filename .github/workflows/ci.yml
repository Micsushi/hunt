name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trusted-linux-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, server1, hunt]
    name: Linux launcher smoke (trusted main)
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hunter/requirements.txt

      - name: Run Linux launcher smoke tests
        run: |
          chmod +x hunter.sh ui.sh fletch.sh scripts/launchers/hunter.sh
          ./hunter.sh queue
          ./ui.sh --help
          ./fletch.sh --help
          for launcher in hunter.sh ui.sh fletch.sh; do
            if "./$launcher" definitely-not-a-command >/tmp/hunt-invalid.log 2>&1; then
              cat /tmp/hunt-invalid.log
              exit 1
            fi
          done

  pull-request-linux-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Linux launcher smoke (public pull request)
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hunter/requirements.txt

      - name: Run Linux launcher smoke tests
        run: |
          chmod +x hunter.sh ui.sh fletch.sh scripts/launchers/hunter.sh
          ./hunter.sh queue
          ./ui.sh --help
          ./fletch.sh --help
          for launcher in hunter.sh ui.sh fletch.sh; do
            if "./$launcher" definitely-not-a-command >/tmp/hunt-invalid.log 2>&1; then
              cat /tmp/hunt-invalid.log
              exit 1
            fi
          done

  hunter-cli-smoke:
    name: Hunter CLI Smoke (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Hunter runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hunter/requirements.txt

      - name: Run standalone launcher smoke on Windows PowerShell
        shell: powershell
        run: |
          .\hunter.ps1 queue
          .\hunter.ps1 definitely-not-a-command *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "hunter.ps1 should return a non-zero exit code for an invalid command."
          }
          exit 0

      - name: Run standalone launcher smoke on Windows cmd
        shell: cmd
        run: |
          hunter.cmd queue
          hunter.cmd definitely-not-a-command >NUL 2>&1
          if %ERRORLEVEL% EQU 0 exit /b 1
          exit /b 0

  ui-cli-smoke:
    name: UI CLI Smoke (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hunter/requirements.txt

      - name: Run standalone launcher smoke on Windows PowerShell
        shell: powershell
        run: |
          .\ui.ps1 --help
          .\ui.ps1 definitely-not-a-command *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "ui.ps1 should return a non-zero exit code for an invalid command."
          }
          exit 0

      - name: Run standalone launcher smoke on Windows cmd
        shell: cmd
        run: |
          ui.cmd --help
          ui.cmd definitely-not-a-command >NUL 2>&1
          if %ERRORLEVEL% EQU 0 exit /b 1
          exit /b 0

  fletch-cli-smoke:
    name: Fletch CLI Smoke (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hunter/requirements.txt

      - name: Run standalone launcher smoke on Windows PowerShell
        shell: powershell
        run: |
          .\fletch.ps1 --help
          .\fletch.ps1 definitely-not-a-command *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "fletch.ps1 should return a non-zero exit code for an invalid command."
          }
          exit 0

      - name: Run standalone launcher smoke on Windows cmd
        shell: cmd
        run: |
          fletch.cmd --help
          fletch.cmd definitely-not-a-command >NUL 2>&1
          if %ERRORLEVEL% EQU 0 exit /b 1
          exit /b 0

  ci-trusted:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, server1, hunt]
    name: Full CI (trusted main)
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hunter/requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest httpx fastapi

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run full CI
        run: python ci.py

  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Full CI (public pull request)
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hunter/requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest httpx fastapi

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run full CI
        run: python ci.py
