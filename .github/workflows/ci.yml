name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  c3-windows:
    name: C3 full checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo and frozen acceptance history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install C3 browser runtime
        run: |
          npm --prefix executioner ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node executioner/node_modules/playwright/cli.js install chromium

      - name: Use canonical Windows temporary paths
        run: |
          $canonicalTemp = node -e "const fs=require('node:fs'),path=require('node:path'); const root=path.join(fs.realpathSync.native(process.env.RUNNER_TEMP),'hunt-c3-tests'); fs.mkdirSync(root,{recursive:true}); process.stdout.write(fs.realpathSync.native(root))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TEMP=$canonicalTemp" >> $env:GITHUB_ENV
          "TMP=$canonicalTemp" >> $env:GITHUB_ENV

      - name: Verify canonical C3 temporary root
        run: node -e "const fs=require('node:fs'),os=require('node:os'); const root=os.tmpdir(); if(root!==fs.realpathSync.native(root)||process.env.TMP!==root||process.env.TEMP!==root) throw new Error('Noncanonical C3 temporary root'); console.log('Canonical C3 temporary root verified')"

      - name: Run complete C3 checks
        run: python ci.py c3

  trusted-linux-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, hunt]
    name: Linux launcher smoke (trusted main)
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fletcher/requirements.txt

      - name: Run Linux launcher smoke tests
        run: |
          chmod +x hunter.sh ui.sh fletch.sh scripts/launchers/hunter.sh
          ./hunter.sh queue
          ./ui.sh --help
          ./fletch.sh --help
          for launcher in hunter.sh ui.sh fletch.sh; do
            if "./$launcher" definitely-not-a-command >/tmp/hunt-invalid.log 2>&1; then
              cat /tmp/hunt-invalid.log
              exit 1
            fi
          done

  pull-request-linux-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Linux launcher smoke (public pull request)
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fletcher/requirements.txt

      - name: Run Linux launcher smoke tests
        run: |
          chmod +x hunter.sh ui.sh fletch.sh scripts/launchers/hunter.sh
          ./hunter.sh queue
          ./ui.sh --help
          ./fletch.sh --help
          for launcher in hunter.sh ui.sh fletch.sh; do
            if "./$launcher" definitely-not-a-command >/tmp/hunt-invalid.log 2>&1; then
              cat /tmp/hunt-invalid.log
              exit 1
            fi
          done

  hunter-cli-smoke:
    name: Hunter CLI Smoke (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Hunter runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fletcher/requirements.txt

      - name: Run standalone launcher smoke on Windows PowerShell
        shell: powershell
        run: |
          .\hunter.ps1 queue
          .\hunter.ps1 definitely-not-a-command *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "hunter.ps1 should return a non-zero exit code for an invalid command."
          }
          exit 0

      - name: Run standalone launcher smoke on Windows cmd
        shell: cmd
        run: |
          hunter.cmd queue
          hunter.cmd definitely-not-a-command >NUL 2>&1
          if %ERRORLEVEL% EQU 0 exit /b 1
          exit /b 0

  ui-cli-smoke:
    name: UI CLI Smoke (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fletcher/requirements.txt

      - name: Run standalone launcher smoke on Windows PowerShell
        shell: powershell
        run: |
          .\ui.ps1 --help
          .\ui.ps1 definitely-not-a-command *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "ui.ps1 should return a non-zero exit code for an invalid command."
          }
          exit 0

      - name: Run standalone launcher smoke on Windows cmd
        shell: cmd
        run: |
          ui.cmd --help
          ui.cmd definitely-not-a-command >NUL 2>&1
          if %ERRORLEVEL% EQU 0 exit /b 1
          exit /b 0

  fletch-cli-smoke:
    name: Fletch CLI Smoke (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fletcher/requirements.txt

      - name: Run standalone launcher smoke on Windows PowerShell
        shell: powershell
        run: |
          .\fletch.ps1 --help
          .\fletch.ps1 definitely-not-a-command *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "fletch.ps1 should return a non-zero exit code for an invalid command."
          }
          exit 0

      - name: Run standalone launcher smoke on Windows cmd
        shell: cmd
        run: |
          fletch.cmd --help
          fletch.cmd definitely-not-a-command >NUL 2>&1
          if %ERRORLEVEL% EQU 0 exit /b 1
          exit /b 0

  ci-trusted:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, hunt]
    name: Full CI (trusted main)
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fletcher/requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest httpx fastapi

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install portable C3 check dependencies
        run: npm --prefix executioner ci

      - name: Run Linux C3 runtime and provenance checks
        working-directory: executioner
        timeout-minutes: 10
        run: |
          node --test tests/live/preflight/runtime-readiness.test.ts tests/live/evidence/process-start-time.test.ts tests/live/evidence/external-monitor-runtime.test.ts tests/revisions/f1-base.test.ts tests/revisions/s2-f0-base.test.ts tests/security/privacy/privacy-baseline.test.ts tests/form/catalogs/catalogs.test.ts tests/product/queue.test.ts
          node scripts/audit-corpus.ts --static

      - name: Run Python and frontend checks
        timeout-minutes: 30
        run: |
          python quality.py all
          python test.py all

  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Full CI (public pull request)
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fletcher/requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest httpx fastapi

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install portable C3 check dependencies
        run: npm --prefix executioner ci

      - name: Run Linux C3 runtime and provenance checks
        working-directory: executioner
        timeout-minutes: 10
        run: |
          node --test tests/live/preflight/runtime-readiness.test.ts tests/live/evidence/process-start-time.test.ts tests/live/evidence/external-monitor-runtime.test.ts tests/revisions/f1-base.test.ts tests/revisions/s2-f0-base.test.ts tests/security/privacy/privacy-baseline.test.ts tests/form/catalogs/catalogs.test.ts tests/product/queue.test.ts
          node scripts/audit-corpus.ts --static

      - name: Run Python and frontend checks
        timeout-minutes: 30
        run: |
          python quality.py all
          python test.py all
