<!doctype html>
<html data-hunt-page-id="integer-shape-b" data-hunt-submit-activated="false">
  <body data-hunt-application-page="questionnaire">
    <main data-automation-id="applyFlowVoluntaryDisclosuresPage">
      <div data-automation-id="formField-veteranStatus">
        <label for="veteran-status">Select Veteran Status <span data-automation-id="required">*</span></label>
        <select id="veteran-status" required>
          <option value="">Select One</option>
          <option>I do not want to answer</option>
          <option>I am not a protected veteran</option>
        </select>
      </div>
      <div data-automation-id="formField-termsConsent">
        <label for="terms-consent">
          <input id="terms-consent" type="checkbox" required>
          Yes, I have read and consent to the terms and conditions
        </label>
      </div>
    </main>
  </body>
</html>
