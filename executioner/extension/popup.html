<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hunt C3</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <header>
    <h1>Hunt <span>C3</span></h1>
    <button id="batch" class="secondary">Open workspace</button>
  </header>
  <section class="connection" aria-label="Connection">
    <p id="connection" role="status">Checking connection</p>
    <p id="connection-details"></p>
    <div id="connection-actions"><button id="connect-local" class="secondary">Connect to local app</button></div>
  </section>
  <main>
    <h2 id="job">Current page</h2>
    <p id="support"></p>
    <button id="partial" aria-describedby="partial-help">Fill current page</button>
    <p id="partial-help" class="action-help">Uses saved answers and resume. Keeps existing entries.</p>
    <div id="prepare-action">
      <button id="fill" class="secondary">Prepare this job</button>
    </div>
    <div id="history" class="history" hidden>
      <button id="undo" class="secondary" disabled>Undo fill</button>
      <button id="redo" class="secondary" disabled>Redo fill</button>
    </div>
    <div id="page-feedback"><p id="status" role="status"></p></div>
    <p class="review-note">Stops before submission. You review and submit.</p>
  </main>
  <details id="settings">
    <summary>Connection settings &amp; help</summary>
    <div class="settings-content">
      <p id="extension-version"></p>
      <p id="browser-details"></p>
      <div id="pairing-actions"></div>
      <label for="token">Pairing key</label>
      <div class="pairing"><input id="token" type="password" autocomplete="off"><button id="connect" class="secondary">Connect</button></div>
      <div id="pairing-feedback"></div>
      <button id="website" class="secondary">Connect Hunt website</button>
      <p>Some custom fields need attention. Review every answer and attachment. Undo lasts until the page reloads.</p>
    </div>
  </details>
</body>
</html>
