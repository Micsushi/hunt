<!doctype html>
<html lang="en" class="popup">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hunt C3</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <nav id="compact-nav" aria-label="Hunt controls" hidden>
    <button class="secondary" data-panel="page">Page</button>
    <button class="secondary" data-panel="result">Result</button>
  </nav>
  <header>
    <div class="brand-group">
      <h1>Hunt <span>C3</span></h1>
      <p id="connection" role="status">Checking connection…</p>
    </div>
    <button id="batch" class="secondary">Open full menu</button>
  </header>
  <div id="connection-actions" hidden><button id="connect-local" class="secondary">Connect to local app</button></div>
  <main>
    <h2 id="job">Current page</h2>
    <p id="support"></p>
    <div id="resumes" hidden>
      <label class="resume-field" for="resume-select">
        <span>Resume</span>
        <select id="resume-select"></select>
      </label>
    </div>
    <div id="actions">
      <button id="partial" disabled>Fill current page</button>
      <div id="prepare-action" hidden><button id="fill" class="secondary" aria-describedby="support" disabled>Prepare this job</button></div>
    </div>
    <div id="history" class="history" hidden>
      <button id="undo" class="secondary" disabled>Undo fill</button>
      <button id="redo" class="secondary" disabled>Redo fill</button>
    </div>
  </main>
  <div id="status" role="status"></div>
  <button id="use-profile-country" class="secondary" hidden disabled>Use Canada from my profile</button>
  <nav id="message-pages" aria-label="Result details" hidden>
    <button id="previous-message" class="secondary" aria-label="Previous part">Previous</button>
    <span id="message-position" role="status"></span>
    <button id="next-message" class="secondary" aria-label="Next part">Next</button>
  </nav>
</body>
</html>
