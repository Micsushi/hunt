<!doctype html>
<html lang="en" class="popup">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hunt C3</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <header>
    <div id="page-context">
      <h1 id="site-name">Hunt C3</h1>
      <p id="site-ats" hidden></p>
    </div>
    <button id="batch" class="secondary" aria-label="Open full menu" title="Open full menu"><span aria-hidden="true">&#x2699;&#xFE0E;</span></button>
  </header>
  <p id="connection" role="status">Checking connection…</p>
  <div id="connection-actions" hidden><button id="connect-local" class="secondary">Connect to local app</button></div>
  <main>
    <p id="support"></p>
    <div id="resumes" hidden>
      <div class="resume-field">
        <span id="resume-label">Resume</span>
        <button id="resume-select" class="secondary" aria-labelledby="resume-label resume-name" aria-expanded="false" aria-controls="resume-picker"><span id="resume-name"></span></button>
      </div>
      <section id="resume-picker" aria-label="Saved resumes" hidden>
        <div class="resume-tools">
          <input id="resume-search" type="search" autocomplete="off" aria-label="Search saved resumes" placeholder="Search resumes">
          <select id="resume-sort" aria-label="Sort saved resumes">
            <option value="name">Name A–Z</option>
            <option value="version">Version ↓</option>
            <option value="version-asc">Version ↑</option>
          </select>
        </div>
        <ul id="resume-list" aria-label="Matching resumes"></ul>
        <p id="no-resumes" role="status" hidden>No matching resumes.</p>
      </section>
    </div>
    <div id="actions">
      <button id="partial" disabled>Fill current page</button>
      <button id="more-actions" class="secondary" aria-expanded="false" aria-controls="other-actions" aria-label="More fill actions" title="More fill actions" hidden>•••</button>
    </div>
    <div id="other-actions" hidden>
      <div id="prepare-action" hidden><button id="fill" class="secondary" aria-describedby="support" disabled>Prepare this job</button></div>
      <div id="history" class="history" hidden>
        <button id="undo" class="secondary" disabled>Undo fill</button>
        <button id="redo" class="secondary" disabled>Redo fill</button>
      </div>
    </div>
    <button id="return-issues" class="text-button" hidden></button>
  </main>
  <section id="issue-view" aria-label="Fill issues" hidden>
    <button id="back-to-fill" class="text-button" hidden>Back to fill</button>
    <div id="issue-description" aria-live="polite" aria-atomic="true">
      <p id="issue-position"></p>
      <h2 id="issue-label" tabindex="-1"></h2>
      <p id="issue-message"></p>
    </div>
    <div id="issue-actions">
      <button id="show-field" hidden>Show field</button>
      <button id="use-profile-country" hidden disabled>Use Canada from my profile</button>
      <nav aria-label="Review issues" id="issue-navigation">
        <button id="previous-message" class="secondary" aria-label="Previous issue">Previous</button>
        <button id="next-message" class="secondary" aria-label="Next issue">Next</button>
      </nav>
    </div>
  </section>
  <div id="status" role="status"></div>
</body>
</html>
