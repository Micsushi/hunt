server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth headers for responses served by the frontend proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Docker DNS resolver — required for variable-based proxy_pass
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $backend "${BACKEND_HOST}:${BACKEND_PORT}";

    # Long-running LLM endpoint — needs extra time for Ollama + pdflatex
    location = /api/fletcher/tailor {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
    }

    # The old server-rendered compatibility UI exposed queue/job data without
    # the SPA session guard. Keep the legacy surface unavailable at the edge.
    location ~* ^/legacy(?:/|$) {
        return 401;
    }

    # Prometheus metrics contain operational queue state and are not a public
    # endpoint. Internal scrapers should use the service bearer token.
    location = /metrics {
        return 401;
    }

    # Proxy API, auth, health, legacy routes to the backend container
    location ~* ^/(auth|api|health|metrics|legacy) {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Immutable SPA asset bundles
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA catch-all — all unmatched paths serve index.html
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
